<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maul Prs</title>
    <style>
        body { font-family: 'Poppins', sans-serif; max-width: 800px; margin: 40px auto; padding: 0 20px; color: #333; background: #f9f9f9; }
        header { text-align: center; margin-bottom: 40px; }
        .post-card { background: #fff; padding: 20px; margin-bottom: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .post-card h2 a { color: #2c3e50; text-decoration: none; }
        .post-card h2 a:hover { color: #3498db; }
        .date { font-size: 0.85rem; color: #888; margin-bottom: 10px; }
        .summary { color: #555; line-height: 1.6; }
    </style>
</head>
<body>

    <header>
        <h1>Maul Prs</h1>
        <p>Kumpulan Artikel, Pemikiran, dan Catatan Perjalanan</p>
    </header>

    <main id="posts-container">
        <p>Memuat artikel...</p>
    </main>

    <script>
        async function loadPosts() {
            try {
                const response = await fetch('posts.json');
                if (!response.ok) throw new Error('Gagal memuat data postingan.');
                const posts = await response.json();
                
                const container = document.getElementById('posts-container');
                container.innerHTML = '';

                if (posts.length === 0) {
                    container.innerHTML = '<p>Belum ada artikel yang dipublikasikan.</p>';
                    return;
                }

                // Urutkan dari yang terbaru (opsional)
                posts.forEach(post => {
                    const card = document.createElement('div');
                    card.className = 'post-card';
                    card.innerHTML = `
                        <h2><a href="article.html?id=${post.id}">${post.title}</a></h2>
                        <div class="date">${post.date}</div>
                        <div class="summary">${post.summary}</div>
                    `;
                    container.appendChild(card);
                });
            } catch (error) {
                console.error(error);
                document.getElementById('posts-container').innerHTML = '<p>Gagal memuat artikel. Pastikan file posts.json tersedia.</p>';
            }
        }

        loadPosts();
    </script>
</body>
</html>
