<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Maul Prs — catatan tentang iman, kehidupan, buku, dan pengembangan diri." />
    <title>Maul Prs — Ideas for Faith, Life & Growth</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <!-- Header Navigation -->
    <header class="site-header">
      <div class="container nav">
        <a class="brand" href="index_2.html">
          <img class="brand-photo" src="assets/profile.png" alt="Maul Prs" onerror="this.style.display = 'none'" />
          <span>Maul Prs</span>
        </a>
        <button class="menu-toggle" onclick="toggleMenu()" aria-label="Toggle Menu">
          <span></span><span></span><span></span>
        </button>
        <nav id="navMenu">
          <a href="#categories">Categories</a>
          <a href="#youtube">YouTube</a>
          <a href="#about">About</a>
        </nav>
      </div>
    </header>

    <main>
      <!-- Hero Section -->
      <section class="hero container">
        <p class="eyebrow">MAUL PRS</p>
        <h1>Ideas worth <em>remembering.</em></h1>
        <p class="hero-copy">Catatan tentang iman, kehidupan, buku, dan proses menjadi manusia yang lebih baik.</p>
        <div class="hero-actions">
          <a class="button" href="#categories">Explore writing</a>
          <a class="text-link" href="#youtube">Watch on YouTube →</a>
        </div>
      </section>

      <!-- Kategori & Postingan Section -->
      <section id="categories" class="section container">
        <div class="category-search-wrapper">
          <div class="category-filter">
            <button class="filter-btn active" onclick="filterPosts('all', this)">Semua</button>
            <button class="filter-btn" onclick="filterPosts('Book Summary', this)">📚 Book Summary</button>
            <button class="filter-btn" onclick="filterPosts('Quote & Nasehat', this)">💡 Quote & Nasehat</button>
            <button class="filter-btn" onclick="filterPosts('Dzikir & Do\'a', this)">🤲 Dzikir & Do'a</button>
            <button class="filter-btn" onclick="filterPosts('Cerita Inspirasi', this)">✨ Cerita Inspirasi</button>
          </div>
          <input id="searchInput" class="search-input" type="search" placeholder="Cari tulisan atau buku..." oninput="handleSearch(this.value)" aria-label="Cari tulisan" />
        </div>

        <!-- Grid Postingan (3 Kolom) -->
        <div class="posts-grid" id="berandaPostsGrid">
          <p style="color: var(--text-muted)">Memuat postingan...</p>
        </div>

        <!-- Navigasi Paginasi -->
        <div class="pagination" id="paginationContainer"></div>
      </section>
    </main>

    <script>
      // Database statis untuk GitHub
      let allPostsData = [
        {
          id: "1",
          title: "Dzikir & Do'a Pagi",
          category: "Dzikir & Do'a",
          type: "Dzikir & Do'a",
          date: "10 Oktober 2026",
          cover: "assets/cover-dzikir.jpg",
          coreMessage: "Kumpulan bacaan dzikir dan doa penenang hati untuk mengawali pagi hari.",
          status: "active"
        }
      ];

      let currentCategory = "all";
      let currentPage = 1;
      const postsPerPage = 6;

      window.addEventListener("DOMContentLoaded", () => {
        applyFilters();
      });

      function renderBerandaPosts(postsToRender) {
        const grid = document.getElementById("berandaPostsGrid");
        const paginationContainer = document.getElementById("paginationContainer");
        
        const activePosts = postsToRender.filter(p => p.status !== "archived");

        if (activePosts.length === 0) {
          grid.innerHTML = '<p style="color: var(--text-muted);">Tidak ada postingan yang ditemukan.</p>';
          paginationContainer.innerHTML = "";
          return;
        }

        const totalPages = Math.ceil(activePosts.length / postsPerPage);
        if (currentPage > totalPages) currentPage = Math.max(1, totalPages);

        const startIndex = (currentPage - 1) * postsPerPage;
        const paginatedPosts = activePosts.slice(startIndex, startIndex + postsPerPage);

        let html = "";
        paginatedPosts.forEach((post) => {
          const bd = post.bookData || {};
          const coverUrl = post.cover || 'assets/default-cover.png';
          
          // Diperbaiki: Membaca kategori secara dinamis dan akurat
          const categoryName = post.category || post.type || bd.bookMainCategory || 'Catatan';
          
          const title = post.title;
          const summaryText = post.coreMessage || bd.bookCore || post.summary || '';

          html += `
            <a href="article.html?id=${post.id}" class="post-card">
              <img src="${coverUrl}" alt="${title}" class="post-card-cover" onerror="this.style.display='none'" />
              <div class="post-card-info">
                <span class="post-card-badge">${categoryName}</span>
                <h3 class="post-card-title">${title}</h3>
                <p class="post-card-desc">${summaryText ? summaryText.substring(0, 90) + "..." : ""}</p>
                <div class="post-card-meta">
                  <span>📅 ${post.date || ""}</span>
                  <span style="color: var(--accent-light); font-weight: 500;">Baca Selengkapnya →</span>
                </div>
              </div>
            </a>
          `;
        });

        grid.innerHTML = html;

        let paginationHtml = "";
        if (totalPages > 1) {
          paginationHtml += `<button class="page-btn" onclick="changePage(${currentPage - 1})" ${currentPage === 1 ? "disabled" : ""}>← Prev</button>`;
          for (let i = 1; i <= totalPages; i++) {
            paginationHtml += `<button class="page-btn ${i === currentPage ? "active" : ""}" onclick="changePage(${i})">${i}</button>`;
          }
          paginationHtml += `<button class="page-btn" onclick="changePage(${currentPage + 1})" ${currentPage === totalPages ? "disabled" : ""}>Next →</button>`;
        }
        paginationContainer.innerHTML = paginationHtml;
      }

      function changePage(page) {
        currentPage = page;
        applyFilters();
        document.getElementById("categories").scrollIntoView({ behavior: 'smooth' });
      }

      function filterPosts(catName, btnEl) {
        currentCategory = catName;
        currentPage = 1;
        document.querySelectorAll(".filter-btn").forEach((btn) => btn.classList.remove("active"));
        if (btnEl) btnEl.classList.add("active");
        applyFilters();
      }

      function handleSearch() {
        currentPage = 1;
        applyFilters();
      }

      function applyFilters() {
        const keyword = document.getElementById("searchInput").value.toLowerCase();
        let filtered = allPostsData;

        if (currentCategory !== "all") {
          filtered = filtered.filter(post => {
            const bd = post.bookData || {};
            const cat = post.category || post.type || bd.bookMainCategory;
            return cat === currentCategory;
          });
        }

        if (keyword.trim() !== "") {
          filtered = filtered.filter(post => {
            const bd = post.bookData || {};
            return (post.title || "").toLowerCase().includes(keyword) || 
                   (post.coreMessage || bd.bookCore || "").toLowerCase().includes(keyword);
          });
        }

        renderBerandaPosts(filtered);
      }
    </script>
  </body>
</html>
