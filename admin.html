<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Admin Panel — Maul Prs</title>
    <link rel="stylesheet" href="css/style.css" />
    <style>
      .admin-wrapper {
        max-width: 1100px;
        margin: 40px auto;
        padding: 40px;
        background: #071a0e;
        border: 1px solid #0f3020;
        border-radius: 12px;
      }

      /* Tab Navigasi Kategori */
      .category-tabs {
        display: flex;
        gap: 10px;
        margin-bottom: 30px;
        border-bottom: 1px solid #0f3020;
        padding-bottom: 15px;
        flex-wrap: wrap;
      }
      .tab-btn {
        background: #032a18;
        border: 1px solid #0f3020;
        color: #d4f0dc;
        padding: 10px 18px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 14px;
        font-weight: 500;
        transition: 0.2s;
      }
      .tab-btn.active {
        background: #34d399;
        color: #020c06;
        border-color: #34d399;
        font-weight: 600;
      }

      .form-group {
        margin-bottom: 22px;
      }
      .form-group label {
        display: block;
        color: #d4f0dc;
        font-size: 15px;
        margin-bottom: 8px;
        font-weight: 500;
      }

      .form-group input[type="text"],
      .form-group textarea,
      .form-group select {
        width: 100%;
        padding: 14px 18px;
        background: #032a18;
        border: 1px solid #0f3020;
        color: #fff;
        border-radius: 8px;
        font-size: 15px;
        box-sizing: border-box;
      }
      .form-group input[type="file"] {
        width: 100%;
        padding: 12px;
        background: #032a18;
        border: 1px solid #0f3020;
        color: #fff;
        border-radius: 8px;
        font-size: 14px;
        box-sizing: border-box;
      }
      .form-group textarea {
        min-height: 140px;
        resize: vertical;
      }

      .form-group input[type="date"] {
        width: 100%;
        padding: 14px 18px;
        background: #032a18;
        border: 1px solid #0f3020;
        color: #fff;
        border-radius: 8px;
        font-size: 15px;
        box-sizing: border-box;
        cursor: pointer;
        color-scheme: dark;
      }

      .btn-submit {
        background: #34d399;
        color: #020c06;
        border: none;
        padding: 14px 24px;
        font-weight: 600;
        border-radius: 8px;
        cursor: pointer;
        width: 100%;
        font-size: 16px;
        transition: 0.2s;
      }
      .btn-submit:hover {
        background: #10b981;
      }

      /* History Tabel */
      .history-section {
        margin-top: 50px;
        border-top: 1px solid #0f3020;
        padding-top: 30px;
      }
      .history-table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 15px;
        font-size: 14px;
      }
      .history-table th,
      .history-table td {
        padding: 14px;
        text-align: left;
        border-bottom: 1px solid #0f3020;
        color: #d4f0dc;
      }
      .history-table th {
        background: #032a18;
        color: #34d399;
        font-weight: 600;
      }
      .action-btns {
        display: flex;
        gap: 8px;
      }
      .btn-action {
        padding: 6px 12px;
        border-radius: 6px;
        font-size: 13px;
        cursor: pointer;
        border: none;
        font-weight: 500;
        text-decoration: none;
      }
      .btn-edit {
        background: #3b82f6;
        color: #fff;
      }
      .btn-archive {
        background: #f59e0b;
        color: #020c06;
      }
      .btn-delete {
        background: #ef4444;
        color: #fff;
      }
      .btn-action:hover {
        opacity: 0.85;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="admin-wrapper">
        <div
          style="
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            border-bottom: 1px solid #0f3020;
            padding-bottom: 15px;
          "
        >
          <h2 style="color: #fff; margin: 0; font-size: 26px" id="mainTitle">
            Panel Admin Postingan
          </h2>
          <a
            href="index.html"
            style="color: #34d399; font-size: 15px; text-decoration: none"
            >← Ke Beranda</a
          >
        </div>

        <!-- Tombol Tab Kategori Utama -->
        <div class="category-tabs">
          <button
            class="tab-btn active"
            onclick="switchTab('Book Summary', event)"
          >
            📚 Book Summary
          </button>
          <button class="tab-btn" onclick="switchTab('Quote & Nasehat', event)">
            💡 Quote & Nasehat
          </button>
          <button class="tab-btn" onclick="switchTab('Dzikir & Do\'a', event)">
            🤲 Dzikir & Do'a
          </button>
          <button
            class="tab-btn"
            onclick="switchTab('Cerita Inspirasi', event)"
          >
            ✨ Cerita Inspirasi
          </button>
        </div>

        <!-- Form Utama -->
        <form id="postForm">
          <input type="hidden" id="editIndex" value="" />
          <input type="hidden" id="postType" value="Book Summary" />

          <!-- Multi-Kategori Tagging -->
          <div id="book-category-group" class="form-group">
            <label for="post-categories"
              >Kategori Tagging (Bisa ketik lebih dari satu, pisahkan dengan
              koma):</label
            >
            <input
              type="text"
              list="category-options"
              id="post-categories"
              placeholder="Contoh: Productivity, Psychology"
            />
            <datalist id="category-options">
              <option value="Finance"></option>
              <option value="Productivity"></option>
              <option value="Thinking"></option>
              <option value="Self Improvement"></option>
              <option value="Parenting"></option>
              <option value="Motivasi"></option>
              <option value="Kehidupan"></option>
              <option value="Hati & Jiwa"></option>
            </datalist>
          </div>

          <div class="form-group">
            <label>Judul Postingan / Artikel</label>
            <input
              type="text"
              id="postTitle"
              required
              placeholder="Masukkan judul..."
            />
          </div>

          <!-- KELOMPOK INPUT KHUSUS DETAIL BUKU -->
          <div
            id="book-details-section"
            style="
              background: #032a18;
              border: 1px solid #0f3020;
              padding: 20px;
              border-radius: 10px;
              margin-bottom: 22px;
            "
          >
            <h3
              style="
                color: #34d399;
                font-size: 16px;
                margin-top: 0;
                margin-bottom: 15px;
                border-bottom: 1px solid #0f3020;
                padding-bottom: 8px;
              "
            >
              📖 Detail Informasi Buku (Khusus Book Summary)
            </h3>

            <div class="form-group">
              <label>Judul Buku</label>
              <input
                type="text"
                id="bookTitle"
                placeholder="Contoh: Atomic Habits"
              />
            </div>

            <div class="form-group">
              <label>Penulis</label>
              <input
                type="text"
                id="bookAuthor"
                placeholder="Contoh: James Clear"
              />
            </div>

            <div class="form-group">
              <label>Tahun Terbit Buku</label>
              <input type="text" id="bookYear" placeholder="Contoh: 2018" />
            </div>

            <div class="form-group">
              <label>Kategori (Pilih Tepat Salah Satu)</label>
              <select id="bookMainCategory">
                <option value="Book Summary">Book Summary</option>
                <option value="Cerita Inspirasi">Cerita Inspirasi</option>
                <option value="Quotes">Quotes</option>
                <option value="Nasehat">Nasehat</option>
                <option value="Dzikir & Do'a">Dzikir & Do'a</option>
              </select>
            </div>

            <div class="form-group">
              <label>Inti Buku (Ringkasan/Pesan Utama)</label>
              <textarea
                id="bookCore"
                style="min-height: 90px"
                placeholder="Tuliskan inti atau ringkasan singkat isi buku..."
              ></textarea>
            </div>

            <div class="form-group" style="margin-bottom: 0">
              <label>Waktu Baca</label>
              <input
                type="text"
                id="bookReadTime"
                placeholder="Contoh: 15-20 menit"
                value=""
              />
            </div>
          </div>
          <!-- AKHIR KELOMPOK DETAIL BUKU -->

          <div class="form-group">
            <label>Tanggal Postingan</label>
            <input
              type="date"
              id="postDate"
              required
              onclick="this.showPicker && this.showPicker()"
            />
          </div>

          <div class="form-group">
            <label>Upload Gambar Sampul (Cover dari Lokal)</label>
            <input type="file" id="postCoverFile" accept="image/*" />
            <input type="hidden" id="postCoverBase64" />
          </div>

          <div class="form-group">
            <label
              >Upload File Artikel Lengkap Format
              <strong>.html</strong> (Opsional)</label
            >
            <input type="file" id="postHtmlFile" accept=".html" />
            <input type="hidden" id="postFullContent" />
          </div>

          <button type="submit" class="btn-submit" id="submitBtn">
            Simpan Postingan Book Summary
          </button>
        </form>

        <!-- Bagian History Postingan -->
        <div class="history-section">
          <h3 style="color: #fff; font-size: 20px; margin-bottom: 15px">
            Riwayat Postingan (History & Manajemen)
          </h3>
          <div style="overflow-x: auto">
            <table class="history-table">
              <thead>
                <tr>
                  <th>Judul</th>
                  <th>Kategori</th>
                  <th>Tanggal</th>
                  <th>Status</th>
                  <th>Aksi</th>
                </tr>
              </thead>
              <tbody id="historyTableBody">
                <tr>
                  <td colspan="5" style="text-align: center; color: #777">
                    Belum ada riwayat postingan.
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>

    <script>
      let activeTab = "Book Summary";

      window.addEventListener("DOMContentLoaded", () => {
        const today = new Date().toISOString().split("T")[0];
        document.getElementById("postDate").value = today;
        renderHistory();
      });

      function switchTab(categoryName, event) {
        activeTab = categoryName;

        document
          .querySelectorAll(".tab-btn")
          .forEach((btn) => btn.classList.remove("active"));
        if (event && event.currentTarget) {
          event.currentTarget.classList.add("active");
        }

        document.getElementById("postType").value = categoryName;
        document.getElementById("submitBtn").innerText =
          `Simpan Postingan ${categoryName}`;

        const catGroup = document.getElementById("book-category-group");
        const bookDetailsSection = document.getElementById(
          "book-details-section",
        );

        if (categoryName === "Cerita Inspirasi") {
          catGroup.style.display = "none";
        } else {
          catGroup.style.display = "block";
        }

        if (categoryName === "Book Summary") {
          bookDetailsSection.style.display = "block";
          document.getElementById("bookMainCategory").value = "Book Summary";
        } else {
          bookDetailsSection.style.display = "none";
        }
      }

      let coverBase64 = "";
      document
        .getElementById("postCoverFile")
        .addEventListener("change", function (e) {
          const file = e.target.files[0];
          if (file) {
            const reader = new FileReader();
            reader.onload = function (event) {
              coverBase64 = event.target.result;
              document.getElementById("postCoverBase64").value = coverBase64;
            };
            reader.readAsDataURL(file);
          }
        });

      let uploadedHtmlContent = "";
      document
        .getElementById("postHtmlFile")
        .addEventListener("change", function (e) {
          const file = e.target.files[0];
          if (file) {
            const reader = new FileReader();
            reader.onload = function (event) {
              uploadedHtmlContent = event.target.result;
              document.getElementById("postFullContent").value =
                uploadedHtmlContent;
            };
            reader.readAsText(file);
          }
        });

      function renderHistory() {
        const posts = JSON.parse(localStorage.getItem("maul_posts")) || [];
        const tbody = document.getElementById("historyTableBody");

        if (posts.length === 0) {
          tbody.innerHTML =
            '<tr><td colspan="5" style="text-align: center; color: #777;">Belum ada riwayat postingan.</td></tr>';
          return;
        }

        let html = "";
        posts.forEach((post, index) => {
          const isArchived = post.status === "archived";
          const catDisplay = Array.isArray(post.categories)
            ? post.categories.join(", ")
            : post.category || post.type;
          html += `
            <tr>
              <td><strong>${post.title}</strong></td>
              <td><span style="color: #34d399; font-weight: 500;">${catDisplay}</span></td>
              <td>${post.date || "-"}</td>
              <td>${isArchived ? '<span style="color: #f59e0b;">Diarsipkan</span>' : '<span style="color: #10b981;">Aktif</span>'}</td>
              <td>
                <div class="action-btns">
                  <button type="button" class="btn-action btn-edit" onclick="editPost(${index})">Edit</button>
                  <button type="button" class="btn-action btn-archive" onclick="toggleArchive(${index})">${isArchived ? "Pulihkan" : "Arsip"}</button>
                  <button type="button" class="btn-action btn-delete" onclick="deletePost(${index})">Hapus</button>
                </div>
              </td>
            </tr>
          `;
        });
        tbody.innerHTML = html;
      }

      document
        .getElementById("postForm")
        .addEventListener("submit", function (e) {
          e.preventDefault();

          const editIndex = document.getElementById("editIndex").value;
          const title = document.getElementById("postTitle").value;
          const postType = document.getElementById("postType").value;

          let selectedCategories = [];
          if (postType !== "Cerita Inspirasi") {
            const rawCatInput = document
              .getElementById("post-categories")
              .value.trim();
            if (rawCatInput !== "") {
              selectedCategories = rawCatInput
                .split(",")
                .map((c) => c.trim())
                .filter((c) => c !== "");
            }
          }
          if (selectedCategories.length === 0) {
            selectedCategories = [postType];
          }

          const dateInput = document.getElementById("postDate").value;
          let formattedDate = dateInput;
          if (dateInput) {
            const d = new Date(dateInput);
            const months = [
              "Januari",
              "Februari",
              "Maret",
              "April",
              "Mei",
              "Juni",
              "Juli",
              "Agustus",
              "September",
              "Oktober",
              "November",
              "Desember",
            ];
            formattedDate = `${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear()}`;
          }

          const cover = document.getElementById("postCoverBase64").value;
          const fullContent = document.getElementById("postFullContent").value;

          // Ambil data detail buku
          const bookData = {
            bookTitle: document.getElementById("bookTitle").value,
            bookAuthor: document.getElementById("bookAuthor").value,
            bookYear: document.getElementById("bookYear").value,
            bookMainCategory: document.getElementById("bookMainCategory").value,
            bookCore: document.getElementById("bookCore").value,
            bookReadTime: document.getElementById("bookReadTime").value,
          };

          const slug = title
            .toLowerCase()
            .replace(/[^a-z0-9\s-]/g, "")
            .trim()
            .replace(/\s+/g, "-");
          let posts = JSON.parse(localStorage.getItem("maul_posts")) || [];

          if (editIndex !== "") {
            posts[editIndex].title = title;
            posts[editIndex].slug = slug;
            posts[editIndex].type = postType;
            posts[editIndex].categories = selectedCategories;
            posts[editIndex].date = formattedDate;
            if (cover) posts[editIndex].cover = cover;
            if (fullContent) posts[editIndex].fullContent = fullContent;
            posts[editIndex].bookData = bookData;

            alert("Postingan berhasil diperbarui!");
            document.getElementById("editIndex").value = "";
            document.getElementById("mainTitle").innerText =
              "Panel Admin Postingan";
          } else {
            const newPost = {
              id: Date.now().toString(),
              slug: slug,
              title,
              type: postType,
              categories: selectedCategories,
              date: formattedDate,
              cover: cover || "",
              summary: bookData.bookCore || "", // Fallback summary diambil dari inti buku
              fullContent:
                fullContent || `<p>${bookData.bookCore || title}</p>`,
              bookData: bookData,
              status: "active",
            };
            posts.unshift(newPost);
            alert("Postingan baru berhasil disimpan!");
          }

          localStorage.setItem("maul_posts", JSON.stringify(posts));
          this.reset();
          document.getElementById("postDate").value = new Date()
            .toISOString()
            .split("T")[0];
          coverBase64 = "";
          uploadedHtmlContent = "";
          renderHistory();
        });

      window.editPost = function (index) {
        const posts = JSON.parse(localStorage.getItem("maul_posts")) || [];
        const post = posts[index];
        if (!post) return;

        document.getElementById("editIndex").value = index;
        document.getElementById("postTitle").value = post.title;
        document.getElementById("postCoverBase64").value = post.cover || "";
        document.getElementById("postFullContent").value =
          post.fullContent || "";

        if (post.categories && Array.isArray(post.categories)) {
          document.getElementById("post-categories").value =
            post.categories.join(", ");
        }

        if (post.bookData) {
          document.getElementById("bookTitle").value =
            post.bookData.bookTitle || "";
          document.getElementById("bookAuthor").value =
            post.bookData.bookAuthor || "";
          document.getElementById("bookYear").value =
            post.bookData.bookYear || "";
          document.getElementById("bookMainCategory").value =
            post.bookData.bookMainCategory || "Book Summary";
          document.getElementById("bookCore").value =
            post.bookData.bookCore || "";
          document.getElementById("bookReadTime").value =
            post.bookData.bookReadTime || "15-20 menit baca";
        }

        document.getElementById("mainTitle").innerText =
          "Edit Postingan: " + post.title;
        document.getElementById("submitBtn").innerText = "Simpan Perubahan";
        window.scrollTo({ top: 0, behavior: "smooth" });
      };

      window.toggleArchive = function (index) {
        let posts = JSON.parse(localStorage.getItem("maul_posts")) || [];
        if (posts[index]) {
          posts[index].status =
            posts[index].status === "archived" ? "active" : "archived";
          localStorage.setItem("maul_posts", JSON.stringify(posts));
          renderHistory();
        }
      };

      window.deletePost = function (index) {
        if (
          confirm(
            "Apakah Anda yakin ingin menghapus postingan ini secara permanen?",
          )
        ) {
          let posts = JSON.parse(localStorage.getItem("maul_posts")) || [];
          posts.splice(index, 1);
          localStorage.setItem("maul_posts", JSON.stringify(posts));
          renderHistory();
        }
      };
    </script>
  </body>
</html>
