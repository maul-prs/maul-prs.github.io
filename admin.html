<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Admin Panel — Maul Prs</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
      .admin-wrapper { max-width: 1100px; margin: 40px auto; padding: 40px; background: #071a0e; border: 1px solid #0f3020; border-radius: 12px; }
      
      /* Tab Navigasi Kategori */
      .category-tabs { display: flex; gap: 10px; margin-bottom: 30px; border-bottom: 1px solid #0f3020; padding-bottom: 15px; flex-wrap: wrap; }
      .tab-btn { background: #032a18; border: 1px solid #0f3020; color: #d4f0dc; padding: 10px 18px; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 500; transition: 0.2s; }
      .tab-btn.active { background: #34d399; color: #020c06; border-color: #34d399; font-weight: 600; }

      .form-group { margin-bottom: 22px; }
      .form-group label { display: block; color: #d4f0dc; font-size: 15px; margin-bottom: 8px; font-weight: 500; }
      
      .form-group input[type="text"], .form-group textarea, .form-group select {
        width: 100%; padding: 14px 18px; background: #032a18; border: 1px solid #0f3020; color: #fff; border-radius: 8px; font-size: 15px; box-sizing: border-box;
      }
      .form-group input[type="file"] {
        width: 100%; padding: 12px; background: #032a18; border: 1px solid #0f3020; color: #fff; border-radius: 8px; font-size: 14px; box-sizing: border-box;
      }
      .form-group textarea { min-height: 140px; resize: vertical; }

      /* Styling Input Tanggal: Lebar penuh & area klik responsif */
      .form-group input[type="date"] {
        width: 100%; 
        padding: 14px 18px; 
        background: #032a18; 
        border: 1px solid #0f3020; 
        color: #fff; 
        border-radius: 8px; 
        font-size: 15px; 
        box-sizing: border-box; 
        cursor: pointer; 
        color-scheme: dark;
      }

      .btn-submit { background: #34d399; color: #020c06; border: none; padding: 14px 24px; font-weight: 600; border-radius: 8px; cursor: pointer; width: 100%; font-size: 16px; transition: 0.2s; }
      .btn-submit:hover { background: #10b981; }
      
      /* History Tabel */
      .history-section { margin-top: 50px; border-top: 1px solid #0f3020; padding-top: 30px; }
      .history-table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 14px; }
      .history-table th, .history-table td { padding: 14px; text-align: left; border-bottom: 1px solid #0f3020; color: #d4f0dc; }
      .history-table th { background: #032a18; color: #34d399; font-weight: 600; }
      .action-btns { display: flex; gap: 8px; }
      .btn-action { padding: 6px 12px; border-radius: 6px; font-size: 13px; cursor: pointer; border: none; font-weight: 500; text-decoration: none; }
      .btn-edit { background: #3b82f6; color: #fff; }
      .btn-archive { background: #f59e0b; color: #020c06; }
      .btn-delete { background: #ef4444; color: #fff; }
      .btn-action:hover { opacity: 0.85; }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="admin-wrapper">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; border-bottom: 1px solid #0f3020; padding-bottom: 15px;">
          <h2 style="color: #fff; margin: 0; font-size: 26px;" id="mainTitle">Panel Admin Postingan</h2>
          <a href="index.html" style="color: #34d399; font-size: 15px; text-decoration: none;">← Ke Beranda</a>
        </div>

        <!-- Tombol Tab Kategori -->
        <div class="category-tabs">
          <button class="tab-btn active" onclick="switchTab('Book Summary')">📚 Book Summary</button>
          <button class="tab-btn" onclick="switchTab('Quote & Nasehat')">💡 Quote & Nasehat</button>
          <button class="tab-btn" onclick="switchTab('Dzikir & Do\'a')">🤲 Dzikir & Do'a</button>
          <button class="tab-btn" onclick="switchTab('Cerita Inspirasi')">✨ Cerita Inspirasi</button>
        </div>
        
        <!-- Form Utama -->
        <form id="postForm">
          <input type="hidden" id="editIndex" value="">
          <input type="hidden" id="postCategory" value="Book Summary">

          <div class="form-group">
            <label>Judul Postingan</label>
            <input type="text" id="postTitle" required placeholder="Masukkan judul...">
          </div>

          <!-- Kotak Tanggal: Klik di bagian mana saja langsung membuka kalender -->
          <div class="form-group">
            <label>Tanggal (Klik di mana saja dalam kolom untuk memunculkan kalender)</label>
            <input type="date" id="postDate" required onclick="this.showPicker && this.showPicker()">
          </div>

          <div class="form-group">
            <label>Upload Gambar Sampul (Cover dari Lokal)</label>
            <input type="file" id="postCoverFile" accept="image/*">
            <input type="hidden" id="postCoverBase64">
          </div>

          <div class="form-group">
            <label id="summaryLabel">Ringkasan / Pengantar Singkat (Tampil di Beranda)</label>
            <textarea id="postSummary" placeholder="Tuliskan ringkasan singkat..."></textarea>
          </div>

          <div class="form-group">
            <label>Upload File Artikel Lengkap Format <strong>.html</strong> (Opsional)</label>
            <input type="file" id="postHtmlFile" accept=".html">
            <input type="hidden" id="postFullContent">
          </div>

          <button type="submit" class="btn-submit" id="submitBtn">Simpan Postingan Book Summary</button>
        </form>

        <!-- Bagian History Postingan -->
        <div class="history-section">
          <h3 style="color: #fff; font-size: 20px; margin-bottom: 15px;">Riwayat Postingan (History & Manajemen)</h3>
          <div style="overflow-x: auto;">
            <table class="history-table">
              <thead>
                <tr>
                  <th>Judul</th>
                  <th>Kategori</th>
                  <th>Tanggal</th>
                  <th>Status</th>
                  <th>Aksi</th>
                </tr>
              </thead>
              <tbody id="historyTableBody">
                <tr><td colspan="5" style="text-align: center; color: #777;">Belum ada riwayat postingan.</td></tr>
              </tbody>
            </table>
          </div>
        </div>

      </div>
    </div>

    <script>
      // Set default tanggal hari ini saat halaman dimuat
      window.addEventListener('DOMContentLoaded', () => {
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('postDate').value = today;
      });

      // Fungsi Berpindah Tab Kategori
      function switchTab(categoryName) {
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        event.currentTarget.classList.add('active');
        
        document.getElementById('postCategory').value = categoryName;
        document.getElementById('submitBtn').innerText = `Simpan Postingan ${categoryName}`;

        const summaryLabel = document.getElementById('summaryLabel');
        if (categoryName === 'Quote & Nasehat') {
          summaryLabel.innerText = "Isi Quote / Nasehat Singkat";
        } else if (categoryName === "Dzikir & Do'a") {
          summaryLabel.innerText = "Teks Dzikir / Do'a & Terjemahan";
        } else if (categoryName === 'Cerita Inspirasi') {
          summaryLabel.innerText = "Ringkasan Cerita Inspirasi";
        } else {
          summaryLabel.innerText = "Ringkasan / Pengantar Singkat (Tampil di Beranda)";
        }
      }

      // Handle Konversi Cover Image ke Base64
      let coverBase64 = "";
      document.getElementById('postCoverFile').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = function(event) {
            coverBase64 = event.target.result;
            document.getElementById('postCoverBase64').value = coverBase64;
          };
          reader.readAsDataURL(file);
        }
      });

      // Handle Load Isi File HTML Artikel
      let uploadedHtmlContent = "";
      document.getElementById('postHtmlFile').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = function(event) {
            uploadedHtmlContent = event.target.result;
            document.getElementById('postFullContent').value = uploadedHtmlContent;
          };
          reader.readAsText(file);
        }
      });

      // Render History Postingan ke Tabel
      function renderHistory() {
        const posts = JSON.parse(localStorage.getItem('maul_posts')) || [];
        const tbody = document.getElementById('historyTableBody');
        
        if (posts.length === 0) {
          tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; color: #777;">Belum ada riwayat postingan.</td></tr>';
          return;
        }

        let html = '';
        posts.forEach((post, index) => {
          const isArchived = post.status === 'archived';
          html += `
            <tr>
              <td><strong>${post.title}</strong></td>
              <td><span style="color: #34d399; font-weight: 500;">${post.category}</span></td>
              <td>${post.date || '-'}</td>
              <td>${isArchived ? '<span style="color: #f59e0b;">Diarsipkan</span>' : '<span style="color: #10b981;">Aktif</span>'}</td>
              <td>
                <div class="action-btns">
                  <button type="button" class="btn-action btn-edit" onclick="editPost(${index})">Edit</button>
                  <button type="button" class="btn-action btn-archive" onclick="toggleArchive(${index})">${isArchived ? 'Pulihkan' : 'Arsip'}</button>
                  <button type="button" class="btn-action btn-delete" onclick="deletePost(${index})">Hapus</button>
                </div>
              </td>
            </tr>
          `;
        });
        tbody.innerHTML = html;
      }

      // Submit Form (Tambah / Update Postingan)
      document.getElementById('postForm').addEventListener('submit', function(e) {
        e.preventDefault();

        const editIndex = document.getElementById('editIndex').value;
        const title = document.getElementById('postTitle').value;
        const category = document.getElementById('postCategory').value;
        
        const dateInput = document.getElementById('postDate').value;
        let formattedDate = dateInput;
        if (dateInput) {
          const d = new Date(dateInput);
          const months = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];
          formattedDate = `${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear()}`;
        }

        const cover = document.getElementById('postCoverBase64').value;
        const summary = document.getElementById('postSummary').value;
        const fullContent = document.getElementById('postFullContent').value;

        let posts = JSON.parse(localStorage.getItem('maul_posts')) || [];

        if (editIndex !== "") {
          posts[editIndex].title = title;
          posts[editIndex].category = category;
          posts[editIndex].date = formattedDate;
          if (cover) posts[editIndex].cover = cover;
          posts[editIndex].summary = summary;
          if (fullContent) posts[editIndex].fullContent = fullContent;

          alert('Postingan berhasil diperbarui!');
          document.getElementById('editIndex').value = "";
          document.getElementById('mainTitle').innerText = "Panel Admin Postingan";
          document.getElementById('submitBtn').innerText = `Simpan Postingan ${category}`;
        } else {
          const newPost = {
            title,
            category,
            date: formattedDate,
            cover: cover || "",
            summary,
            fullContent: fullContent || `<p>${summary}</p>`,
            status: 'active'
          };
          posts.unshift(newPost);
          alert('Postingan baru berhasil disimpan!');
        }

        localStorage.setItem('maul_posts', JSON.stringify(posts));
        this.reset();
        document.getElementById('postDate').value = new Date().toISOString().split('T')[0];
        coverBase64 = "";
        uploadedHtmlContent = "";
        renderHistory();
      });

      // Fungsi Edit Postingan
      window.editPost = function(index) {
        const posts = JSON.parse(localStorage.getItem('maul_posts')) || [];
        const post = posts[index];
        if (!post) return;

        document.getElementById('editIndex').value = index;
        document.getElementById('postTitle').value = post.title;
        document.getElementById('postCategory').value = post.category;
        document.getElementById('postSummary').value = post.summary;
        document.getElementById('postCoverBase64').value = post.cover || "";
        document.getElementById('postFullContent').value = post.fullContent || "";

        document.getElementById('mainTitle').innerText = "Edit Postingan: " + post.title;
        document.getElementById('submitBtn').innerText = "Simpan Perubahan";
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      // Fungsi Arsip / Pulihkan Postingan
      window.toggleArchive = function(index) {
        let posts = JSON.parse(localStorage.getItem('maul_posts')) || [];
        if (posts[index]) {
          posts[index].status = posts[index].status === 'archived' ? 'active' : 'archived';
          localStorage.setItem('maul_posts', JSON.stringify(posts));
          renderHistory();
        }
      };

      // Fungsi Hapus Postingan
      window.deletePost = function(index) {
        if (confirm("Apakah Anda yakin ingin menghapus postingan ini secara permanen?")) {
          let posts = JSON.parse(localStorage.getItem('maul_posts')) || [];
          posts.splice(index, 1);
          localStorage.setItem('maul_posts', JSON.stringify(posts));
          renderHistory();
        }
      };

      // Muat history saat halaman dibuka
      renderHistory();
    </script>
  </body>
</html>
