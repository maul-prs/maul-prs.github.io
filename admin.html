<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Maul Prs</title>
    <style>
        body { font-family: 'Poppins', sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; background: #f4f6f9; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        h2 { color: #2c3e50; text-align: center; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; color: #333; }
        input[type="text"], textarea, input[type="password"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        textarea { height: 150px; }
        button { background: #27ae60; color: white; border: none; padding: 12px 20px; font-size: 1rem; border-radius: 4px; cursor: pointer; width: 100%; }
        button:hover { background: #219653; }
        .status { margin-top: 15px; text-align: center; font-weight: bold; }
    </style>
</head>
<body>

    <h2>Admin Tool - Tambah Artikel</h2>
    
    <div class="form-group">
        <label>GitHub Personal Access Token (PAT)</label>
        <input type="password" id="gh-token" placeholder="Masukkan PAT GitHub Anda (simpan untuk kemudahan)">
    </div>

    <hr style="margin: 20px 0; border: 0; border-top: 1px solid #ddd;">

    <div class="form-group">
        <label>Judul Artikel</label>
        <input type="text" id="article-title" placeholder="Contoh: Belajar Konsisten Menulis">
    </div>

    <div class="form-group">
        <label>Ringkasan Singkat (Snippet)</label>
        <textarea style="height: 80px;" id="article-summary" placeholder="Tulis ringkasan pendek untuk halaman utama..."></textarea>
    </div>

    <div class="form-group">
        <label>Isi Artikel (Format HTML / Teks)</label>
        <textarea id="article-body" placeholder="<p>Paragraf pertama...</p><p>Paragraf kedua...</p>"></textarea>
    </div>

    <button onclick="publishArticle()">Simpan & Publish ke GitHub</button>
    <div class="status" id="status-msg"></div>

    <script>
        // Konfigurasi Repository GitHub Anda (Sesuaikan dengan milik Anda) / GitHub Personal Access Token (PAT)
        const GITHUB_USER = "maul-prs"; // Ganti dengan username GitHub Anda
        const GITHUB_REPO = "maul-prs"; // Ganti dengan nama repo Anda (misal: maul-prs)

        // Simpan token di localStorage agar tidak perlu mengetik ulang terus menerus
        const tokenInput = document.getElementById('gh-token');
        tokenInput.value = localStorage.getItem('gh_token') || '';
        tokenInput.addEventListener('input', () => {
            localStorage.setItem('gh_token', tokenInput.value);
        });

        async function getFileFromGitHub(path) {
            const url = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${path}`;
            const res = await fetch(url, {
                headers: { 'Authorization': `token ${tokenInput.value}` }
            });
            if (!res.ok) return null;
            return await res.json();
        }

        async function saveFileToGitHub(path, content, message, sha = null) {
            const url = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${path}`;
            const bodyData = {
                message: message,
                content: btoa(unescape(encodeURIComponent(content))) // Encode ke Base64 aman untuk karakter Unicode
            };
            if (sha) bodyData.sha = sha;

            const res = await fetch(url, {
                method: 'PUT',
                headers: {
                    'Authorization': `token ${tokenInput.value}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(bodyData)
            });

            if (!res.ok) {
                const errJson = await res.json();
                throw new Error(errJson.message || 'Gagal menyimpan ke GitHub');
            }
            return await res.json();
        }

        async function publishArticle() {
            const token = tokenInput.value.trim();
            const title = document.getElementById('article-title').value.trim();
            const summary = document.getElementById('article-summary').value.trim();
            const body = document.getElementById('article-body').value.trim();
            const statusMsg = document.getElementById('status-msg');

            if (!token || !title || !body) {
                alert('Token, Judul, dan Isi Artikel wajib diisi!');
                return;
            }

            statusMsg.style.color = '#333';
            statusMsg.innerText = 'Sedang memproses dan mengirim ke GitHub...';

            try {
                // 1. Buat ID unik dan nama file dari judul
                const id = title.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
                const filename = `${id}.html`;
                const date = new Date().toISOString().split('T')[0];

                // 2. Upload file HTML isi artikel ke folder "articles/"
                await saveFileToGitHub(`articles/${filename}`, body, `Add article: ${title}`);

                // 3. Ambil file "posts.json" yang sudah ada di GitHub untuk diperbarui
                const postsFile = await getFileFromGitHub('posts.json');
                let posts = [];
                let postsSha = null;

                if (postsFile) {
                    postsSha = postsFile.sha;
                    // Decode dari Base64 kembali ke teks JSON
                    const decodedContent = decodeURIComponent(escape(atob(postsFile.content)));
                    posts = JSON.parse(decodedContent);
                }

                // 4. Tambahkan artikel baru ke dalam array posts (paling atas / terbaru)
                posts.unshift({
                    id: id,
                    title: title,
                    date: date,
                    summary: summary,
                    filename: filename
                });

                // 5. Simpan ulang file "posts.json" yang sudah diperbarui ke GitHub
                await saveFileToGitHub('posts.json', JSON.stringify(posts, null, 2), `Update posts.json with: ${title}`, postsSha);

                statusMsg.style.color = '#27ae60';
                statusMsg.innerText = 'Berhasil! Artikel sudah dipublikasikan secara otomatis ke GitHub.';
                
                // Bersihkan form
                document.getElementById('article-title').value = '';
                document.getElementById('article-summary').value = '';
                document.getElementById('article-body').value = '';

            } catch (error) {
                console.error(error);
                statusMsg.style.color = '#c0392b';
                statusMsg.innerText = 'Terjadi kesalahan: ' + error.message;
            }
        }
    </script>
</body>
</html>
