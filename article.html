<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title id="pageTitle">Detail Artikel — Maul Prs</title>
    <link rel="stylesheet" href="css/style.css" />
    <style>
      html {
        scroll-behavior: smooth;
      }
      .site-header {
        padding: 10px 0 !important;
      }
      .site-header .nav {
        min-height: auto !important;
      }

      .article-layout {
        display: grid;
        grid-template-columns: 260px 1fr 280px;
        gap: 24px;
        padding: 20px 0 80px 0;
        align-items: start;
      }

      .sidebar-card,
      .category-card-container,
      .toc-card-container {
        background: var(--bg-card, #071a0e);
        border: 1px solid var(--border-color, #0f3020);
        border-radius: 12px;
        padding: 20px;
        margin-bottom: 20px;
      }

      .sidebar-title {
        color: #fff;
        font-size: 15px;
        font-weight: 700;
        margin-top: 0;
        margin-bottom: 14px;
        border-bottom: 1px solid var(--border-color, #0f3020);
        padding-bottom: 10px;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .sidebar-left-sticky,
      .sidebar-right-sticky {
        position: sticky;
        top: 75px;
      }

      /* CUSTOM SCROLLBAR SIDEBAR */
      .category-scroll-area,
      .toc-scroll-area {
        max-height: 420px;
        overflow-y: auto;
        padding-right: 4px;
      }

      .category-scroll-area::-webkit-scrollbar,
      .toc-scroll-area::-webkit-scrollbar {
        width: 5px;
      }
      .category-scroll-area::-webkit-scrollbar-track,
      .toc-scroll-area::-webkit-scrollbar-track {
        background: rgba(3, 42, 24, 0.5);
        border-radius: 10px;
      }
      .category-scroll-area::-webkit-scrollbar-thumb,
      .toc-scroll-area::-webkit-scrollbar-thumb {
        background: #0f3020;
        border-radius: 10px;
      }
      .category-scroll-area::-webkit-scrollbar-thumb:hover,
      .toc-scroll-area::-webkit-scrollbar-thumb:hover {
        background: #34d399;
      }

      /* ACCORDION SIDEBAR KIRI */
      .acc-category-item {
        margin-bottom: 8px;
      }
      .acc-btn {
        width: 100%;
        background: rgba(3, 42, 24, 0.6);
        border: 1px solid var(--border-color, #0f3020);
        color: #d4f0dc;
        padding: 10px 12px;
        border-radius: 8px;
        font-size: 13px;
        font-weight: 600;
        text-align: left;
        cursor: pointer;
        display: flex;
        justify-content: space-between;
        align-items: center;
        transition: all 0.2s ease;
      }
      .acc-btn:hover, .acc-btn.active {
        background: #0f3020;
        color: #34d399;
        border-color: #34d399;
      }
      .acc-icon {
        font-size: 11px;
        transition: transform 0.2s ease;
      }
      .acc-btn.active .acc-icon {
        transform: rotate(180deg);
      }
      .acc-post-list {
        list-style: none;
        padding: 6px 0 6px 10px;
        margin: 0;
        display: none;
      }
      .acc-post-list.open {
        display: block;
      }
      .acc-post-item a {
        color: var(--text-muted, #9ca3af);
        text-decoration: none;
        font-size: 12px;
        display: block;
        padding: 6px 10px;
        border-radius: 6px;
        line-height: 1.4;
        transition: 0.2s;
        border-left: 2px solid transparent;
      }
      .acc-post-item a:hover, .acc-post-item a.current-article {
        color: #fff;
        background: rgba(52, 211, 153, 0.1);
        border-left-color: #34d399;
      }

      /* DAFTAR BAB SIDEBAR KANAN */
      .toc-list {
        list-style: none;
        padding: 0;
        margin: 0;
      }
      .toc-list li {
        margin-bottom: 6px;
      }
      .toc-list a {
        color: #a3b8cc;
        text-decoration: none;
        font-size: 13px;
        line-height: 1.5;
        display: flex;
        align-items: flex-start;
        gap: 8px;
        padding: 8px 10px;
        border-radius: 6px;
        background: rgba(3, 42, 24, 0.3);
        border: 1px solid transparent;
        transition: all 0.2s ease;
      }
      .toc-list a:hover {
        color: #34d399;
        background: #032a18;
        border-color: #0f3020;
        transform: translateX(3px);
      }
      .toc-bullet {
        color: #34d399;
        font-size: 12px;
        margin-top: 2px;
      }

      /* HERO BOX UTAMA ARTIKEL */
      .article-hero-box {
        background: rgba(3, 42, 24, 0.7);
        border: 1px solid var(--border-color, #0f3020);
        border-radius: 12px;
        padding: 24px;
        display: grid;
        grid-template-columns: 160px 1fr;
        gap: 22px;
        margin-bottom: 28px;
        align-items: center;
      }

      .article-hero-cover {
        width: 100%;
        height: 210px;
        border-radius: 8px;
        object-fit: cover;
        border: 1px solid var(--border-color, #0f3020);
        background: #032a18;
      }

      .article-hero-info {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .article-badge-tag {
        display: inline-block;
        background: #032a18;
        border: 1px solid var(--border-color, #0f3020);
        color: var(--accent-light, #34d399);
        font-size: 11px;
        font-weight: 600;
        padding: 3px 10px;
        border-radius: 12px;
        width: fit-content;
      }

      .article-title-sub {
        font-size: 26px;
        font-weight: 800;
        color: #ffffff;
        margin: 0;
        line-height: 1.25;
      }

      .article-core-desc {
        font-size: 14px;
        color: var(--text-main, #d4f0dc);
        line-height: 1.6;
        margin: 2px 0;
      }

      .main-article-card {
        background: var(--bg-card, #071a0e);
        border: 1px solid var(--border-color, #0f3020);
        border-radius: 12px;
        padding: 28px;
      }

      .article-content {
        color: var(--text-main, #d4f0dc);
        line-height: 1.8;
        font-size: 16px;
      }

      .article-content h2,
      .article-content h3 {
        color: #fff;
        margin-top: 32px;
        scroll-margin-top: 80px;
      }

      @media (max-width: 1024px) {
        .article-layout {
          grid-template-columns: 1fr;
        }
        .article-hero-box {
          grid-template-columns: 100px 1fr;
          gap: 14px;
          padding: 14px;
        }
        .article-hero-cover {
          height: 130px;
        }
        .article-title-sub {
          font-size: 17px;
        }
      }
    </style>
  </head>
  <body>
    <header class="site-header">
      <div class="container nav">
        <a class="brand" href="index.html">
          <img
            class="brand-photo"
            src="assets/profile.png"
            alt="Maul Prs"
            onerror="this.style.display='none'"
          />
          <span>Maul Prs</span>
        </a>
        <a
          href="index.html"
          style="
            color: var(--accent-light, #34d399);
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
          "
        >
          ← Beranda
        </a>
      </div>
    </header>

    <main class="container article-layout">
      <!-- SIDEBAR KIRI: ACCORDION KATEGORI -->
      <div class="sidebar-left-sticky">
        <aside class="category-card-container">
          <h3 class="sidebar-title">📑 Kategori & Artikel</h3>
          <div class="category-scroll-area" id="accordionContainer">
            <p style="color: #777; font-size: 12px;">Memuat menu...</p>
          </div>
        </aside>
      </div>

      <!-- KONTEN UTAMA ARTIKEL -->
      <section class="main-article-card">
        <div id="articleHeroBox" class="article-hero-box">
          <img
            id="articleCover"
            src="assets/default-cover.png"
            alt="Cover"
            class="article-hero-cover"
            onerror="this.src='assets/default-cover.png'"
          />
          <div class="article-hero-info">
            <span id="articleCategoryBadge" class="article-badge-tag">Kategori</span>
            <h1 id="articleTitleDisplay" class="article-title-sub">-</h1>
            <p
              id="articleMetaAuthor"
              style="
                color: #a3e635;
                font-size: 13px;
                margin: 0;
                display: none;
                font-weight: 500;
              "
            ></p>
            <p id="articleCoreDisplay" class="article-core-desc">-</p>
            <div
              style="
                font-size: 12px;
                color: #888;
                border-top: 1px solid rgba(255, 255, 255, 0.08);
                padding-top: 8px;
              "
            >
              📅 Tanggal:
              <strong id="articleDateDisplay" style="color: #fff">-</strong>
            </div>
          </div>
        </div>

        <article id="articleContent" class="article-content">
          <p style="color: var(--text-muted)">Memuat konten...</p>
        </article>
      </section>

      <!-- SIDEBAR KANAN: DAFTAR BAB (TOC) -->
      <div class="sidebar-right-sticky">
        <aside
          id="tocSidebarCard"
          class="toc-card-container"
          style="display: none"
        >
          <h3 class="sidebar-title">📖 Bab & Sub-Judul</h3>
          <div class="toc-scroll-area">
            <ul class="toc-list" id="tocList"></ul>
          </div>
        </aside>
      </div>
    </main>

    <script>
      let currentArticleId = "";

      window.addEventListener("DOMContentLoaded", () => {
        try {
          const urlParams = new URLSearchParams(window.location.search);
          currentArticleId = urlParams.get("id");

          const storedPosts = JSON.parse(localStorage.getItem("maul_posts")) || [];
          
          // Data Default Lengkap jika localStorage kosong
          const defaultPosts = [
            {
              id: "1",
              title: "Dzikir & Do'a Pagi",
              type: "Dzikir & Do'a",
              category: "Dzikir & Do'a",
              date: "10 Oktober 2026",
              cover: "assets/cover-dzikir.jpg",
              coreMessage: "Kumpulan bacaan dzikir dan doa penenang hati untuk mengawali pagi hari.",
              fullContent: "<h2 id='istiadzah'>Isti'adzah</h2><p>أَعُوذُ بِاللَّهِ مِنَ الشَّيْطَانِ الرَّجِيمِ...</p>",
            },
            {
              id: "2",
              title: "The Lost Art of Listening",
              type: "Book Summary",
              category: "Book Summary",
              date: "10 Oktober 2026",
              cover: "assets/cover-listening.jpg",
              coreMessage: "Mendengarkan sungguh-sungguh membuat orang merasa dimengerti dan itulah kunci hubungan yang sehat.",
              fullContent: "<h2>Pengantar: Tentang Buku Ini</h2><p>Pernahkah kamu bercerita panjang lebar, lalu sadar lawan bicaramu sibuk menyusun jawabannya sendiri?</p>",
              bookData: {
                bookAuthor: "Michael P. Nichols",
                bookYear: "1995"
              }
            }
          ];

          const allPosts = storedPosts.length > 0 ? storedPosts : defaultPosts;
          
          let post = null;
          if (currentArticleId) {
            post = allPosts.find((p) => String(p.id) === String(currentArticleId));
          }
          if (!post) {
            post = allPosts[0];
          }

          currentArticleId = String(post.id);
          document.title = `${post.title} — Maul Prs`;

          const bd = post.bookData || {};
          const catName = post.type || post.category || bd.bookMainCategory || "Catatan";

          document.getElementById("articleCategoryBadge").textContent = catName;
          document.getElementById("articleTitleDisplay").textContent = post.title;
          document.getElementById("articleCoreDisplay").textContent = post.coreMessage || bd.bookCore || post.summary || "";
          document.getElementById("articleDateDisplay").textContent = post.date || "-";

          const authorEl = document.getElementById("articleMetaAuthor");
          if (bd.bookAuthor) {
            authorEl.textContent = `✍️ Penulis: ${bd.bookAuthor} ${bd.bookYear ? `(${bd.bookYear})` : ""}`;
            authorEl.style.display = "block";
          } else {
            authorEl.style.display = "none";
          }

          const coverEl = document.getElementById("articleCover");
          if (post.cover && post.cover.trim() !== "") {
            coverEl.src = post.cover;
            coverEl.style.display = "block";
          } else {
            coverEl.src = "assets/default-cover.png";
          }

          const rawContent = post.fullContent || `<p>${post.coreMessage || bd.bookCore || post.title}</p>`;
          document.getElementById("articleContent").innerHTML = rawContent;

          renderAccordionSidebar(allPosts, catName);
          generateTableOfContents();
        } catch (err) {
          console.error("Error loading article:", err);
        }
      });

      // RENDER SIDEBAR KIRI (ACCORDION)
      function renderAccordionSidebar(allPosts, currentCatName) {
        const categories = [
          { name: "Book Summary", icon: "📚" },
          { name: "Quote & Nasehat", icon: "💡" },
          { name: "Dzikir & Do'a", icon: "🤲" },
          { name: "Cerita Inspirasi", icon: "✨" }
        ];

        const container = document.getElementById("accordionContainer");
        let html = "";

        categories.forEach((cat) => {
          const matchingPosts = allPosts.filter(p => {
            const bd = p.bookData || {};
            const c = p.type || p.category || bd.bookMainCategory;
            return c === cat.name;
          });

          const isCurrentCat = (currentCatName === cat.name);

          html += `
            <div class="acc-category-item">
              <button class="acc-btn ${isCurrentCat ? 'active' : ''}" onclick="toggleAccordion(this)">
                <span>${cat.icon} ${cat.name} (${matchingPosts.length})</span>
                <span class="acc-icon">▼</span>
              </button>
              <ul class="acc-post-list ${isCurrentCat ? 'open' : ''}">
          `;

          if (matchingPosts.length === 0) {
            html += `<li class="acc-post-item"><span style="color: #666; font-size: 11px; padding: 4px 10px; display:block;">Belum ada tulisan</span></li>`;
          } else {
            matchingPosts.forEach(p => {
              const isCurrent = (String(p.id) === String(currentArticleId));
              html += `
                <li class="acc-post-item">
                  <a href="article.html?id=${p.id}" class="${isCurrent ? 'current-article' : ''}">
                    ${p.title}
                  </a>
                </li>
              `;
            });
          }

          html += `
              </ul>
            </div>
          `;
        });

        container.innerHTML = html;
      }

      function toggleAccordion(btnEl) {
        const listEl = btnEl.nextElementSibling;
        if (listEl) {
          btnEl.classList.toggle("active");
          listEl.classList.toggle("open");
        }
      }

      // RENDER SIDEBAR KANAN (TOC HALUS)
      function generateTableOfContents() {
        const headings = document.getElementById("articleContent").querySelectorAll("h2, h3");
        const tocCard = document.getElementById("tocSidebarCard");
        const tocList = document.getElementById("tocList");

        if (!headings || headings.length === 0) {
          tocCard.style.display = "none";
          return;
        }

        let html = "";
        headings.forEach((h, index) => {
          if (!h.id) h.id = `heading-${index}`;
          html += `
            <li>
              <a href="#${h.id}">
                <span class="toc-bullet">📍</span>
                <span>${h.textContent}</span>
              </a>
            </li>
          `;
        });

        tocList.innerHTML = html;
        tocCard.style.display = "block";
      }
    </script>
  </body>
</html>
