<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detail Artikel</title>
    <style>
        body { font-family: 'Poppins', sans-serif; max-width: 750px; margin: 40px auto; padding: 0 20px; color: #333; line-height: 1.8; }
        .back-link { display: inline-block; margin-bottom: 20px; color: #3498db; text-decoration: none; }
        .back-link:hover { text-decoration: underline; }
        h1 { color: #2c3e50; }
        .date { font-size: 0.9rem; color: #888; margin-bottom: 30px; border-bottom: 1px solid #eee; padding-bottom: 10px; }
    </style>
</head>
<body>

    <a href="index.html" class="back-link">&larr; Kembali ke Beranda</a>
    
    <main id="article-content">
        <p>Memuat isi artikel...</p>
    </main>

    <script>
        async function loadArticle() {
            const params = new URLSearchParams(window.location.search);
            const postId = params.get('id');

            if (!postId) {
                document.getElementById('article-content').innerHTML = '<h2>Artikel tidak ditemukan.</h2>';
                return;
            }

            try {
                const res = await fetch('posts.json');
                const posts = await res.json();
                const post = posts.find(p => p.id === postId);

                if (!post) {
                    document.getElementById('article-content').innerHTML = '<h2>Artikel tidak terdaftar di sistem.</h2>';
                    return;
                }

                // Ambil file HTML isi artikel dari folder articles/
                const articleRes = await fetch(`articles/${post.filename}`);
                if (!articleRes.ok) throw new Error('File HTML artikel tidak ditemukan.');
                const htmlContent = await articleRes.text();

                document.getElementById('article-content').innerHTML = `
                    <h1>${post.title}</h1>
                    <div class="date">Dipublikasikan pada: ${post.date}</div>
                    <div class="content">${htmlContent}</div>
                `;
                document.title = `${post.title} - Maul Prs`;
            } catch (err) {
                console.error(err);
                document.getElementById('article-content').innerHTML = '<h2>Gagal memuat isi artikel.</h2>';
            }
        }

        loadArticle();
    </script>
</body>
</html>
