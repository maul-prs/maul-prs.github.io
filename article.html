<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title id="pageTitle">Detail Artikel — Maul Prs</title>
    <link rel="stylesheet" href="css/style.css" />
    <style>
      html {
        scroll-behavior: smooth;
      }
      .site-header {
        padding: 10px 0 !important;
      }
      .site-header .nav {
        min-height: auto !important;
      }

      .article-layout {
        display: grid;
        grid-template-columns: 240px 1fr 260px;
        gap: 24px;
        padding: 20px 0 80px 0;
        align-items: start;
      }

      .sidebar-card,
      .category-card-container,
      .toc-card-container {
        background: var(--bg-card, #071a0e);
        border: 1px solid var(--border-color, #0f3020);
        border-radius: 12px;
        padding: 18px;
        margin-bottom: 20px;
      }

      .sidebar-title {
        color: #fff;
        font-size: 16px;
        margin-top: 0;
        margin-bottom: 12px;
        border-bottom: 1px solid var(--border-color, #0f3020);
        padding-bottom: 8px;
      }

      .sidebar-left-sticky,
      .sidebar-right-sticky {
        position: sticky;
        top: 75px;
      }

      .category-scroll-area,
      .toc-scroll-area {
        max-height: 320px;
        overflow-y: auto;
      }

      .category-list,
      .toc-list {
        list-style: none;
        padding: 0;
        margin: 0;
      }

      .category-list li,
      .toc-list li {
        margin-bottom: 10px;
      }

      .category-list a,
      .toc-list a {
        color: #d4f0dc;
        text-decoration: none;
        font-size: 14px;
        transition: 0.2s;
        display: block;
      }

      .category-list a:hover,
      .toc-list a:hover {
        color: #34d399;
      }

      /* Kotak Informasi Utama Artikel / Buku */
      .article-hero-box {
        background: rgba(3, 42, 24, 0.7);
        border: 1px solid var(--border-color, #0f3020);
        border-radius: 12px;
        padding: 24px;
        display: grid;
        grid-template-columns: 160px 1fr;
        gap: 22px;
        margin-bottom: 28px;
        align-items: center;
      }

      .article-hero-cover {
        width: 100%;
        height: 210px;
        border-radius: 8px;
        object-fit: cover;
        border: 1px solid var(--border-color, #0f3020);
        background: #032a18;
      }

      .article-hero-info {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .article-badge-tag {
        display: inline-block;
        background: #032a18;
        border: 1px solid var(--border-color, #0f3020);
        color: var(--accent-light, #34d399);
        font-size: 11px;
        font-weight: 600;
        padding: 3px 10px;
        border-radius: 12px;
        width: fit-content;
      }

      .article-title-sub {
        font-size: 26px;
        font-weight: 800;
        color: #ffffff;
        margin: 0;
        line-height: 1.25;
      }

      .article-core-desc {
        font-size: 14px;
        color: var(--text-main, #d4f0dc);
        line-height: 1.6;
        margin: 2px 0;
      }

      .main-article-card {
        background: var(--bg-card, #071a0e);
        border: 1px solid var(--border-color, #0f3020);
        border-radius: 12px;
        padding: 28px;
      }

      .article-content {
        color: var(--text-main, #d4f0dc);
        line-height: 1.8;
        font-size: 16px;
      }

      .article-content h2,
      .article-content h3 {
        color: #fff;
        margin-top: 32px;
        scroll-margin-top: 80px;
      }

      @media (max-width: 1024px) {
        .article-layout {
          grid-template-columns: 1fr;
        }
        .article-hero-box {
          grid-template-columns: 100px 1fr;
          gap: 14px;
          padding: 14px;
        }
        .article-hero-cover {
          height: 130px;
        }
        .article-title-sub {
          font-size: 17px;
        }
      }
    </style>
  </head>
  <body>
    <header class="site-header">
      <div class="container nav">
        <a class="brand" href="index.html">
          <img
            class="brand-photo"
            src="assets/profile.png"
            alt="Maul Prs"
            onerror="this.style.display='none'"
          />
          <span>Maul Prs</span>
        </a>
        <a
          href="index.html"
          style="
            color: var(--accent-light, #34d399);
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
          "
        >
          ← Beranda
        </a>
      </div>
    </header>

    <main class="container article-layout">
      <!-- SIDEBAR KIRI: Kategori -->
      <div class="sidebar-left-sticky">
        <aside class="category-card-container">
          <h3 class="sidebar-title">Kategori & Menu</h3>
          <div class="category-scroll-area">
            <ul class="category-list" id="categorySidebar">
              <li><a href="index.html">Semua Tulisan</a></li>
              <li><a href="index.html#categories">📚 Book Summary</a></li>
              <li><a href="index.html#categories">💡 Quote & Nasehat</a></li>
              <li><a href="index.html#categories">🤲 Dzikir & Do'a</a></li>
              <li><a href="index.html#categories">✨ Cerita Inspirasi</a></li>
            </ul>
          </div>
        </aside>
      </div>

      <!-- KONTEN UTAMA ARTIKEL -->
      <section class="main-article-card">
        <!-- Hero Box Informasi Artikel (Cover + Inti/Ringkasan) -->
        <div id="articleHeroBox" class="article-hero-box">
          <img
            id="articleCover"
            src="assets/default-cover.png"
            alt="Cover"
            class="article-hero-cover"
          />
          <div class="article-hero-info">
            <span id="articleCategoryBadge" class="article-badge-tag"
              >Kategori</span
            >
            <h1 id="articleTitleDisplay" class="article-title-sub">-</h1>
            <p
              id="articleMetaAuthor"
              style="
                color: #a3e635;
                font-size: 13px;
                margin: 0;
                display: none;
                font-weight: 500;
              "
            ></p>
            <p id="articleCoreDisplay" class="article-core-desc">-</p>
            <div
              style="
                font-size: 12px;
                color: #888;
                border-top: 1px solid rgba(255, 255, 255, 0.08);
                padding-top: 8px;
              "
            >
              📅 Tanggal:
              <strong id="articleDateDisplay" style="color: #fff">-</strong>
            </div>
          </div>
        </div>

        <article id="articleContent" class="article-content">
          <p style="color: var(--text-muted)">Memuat konten...</p>
        </article>
      </section>

      <!-- SIDEBAR KANAN: Daftar Bab (TOC) -->
      <div class="sidebar-right-sticky">
        <aside
          id="tocSidebarCard"
          class="toc-card-container"
          style="display: none"
        >
          <h3 class="sidebar-title">📖 Bab & Sub-Judul</h3>
          <div class="toc-scroll-area">
            <ul class="toc-list" id="tocList"></ul>
          </div>
        </aside>
      </div>
    </main>

    <script>
      window.addEventListener("DOMContentLoaded", () => {
        // 1. Ambil ID postingan dari URL query string (?id=...)
        const urlParams = new URLSearchParams(window.location.search);
        const articleId = urlParams.get("id");

        // 2. Baca data dari localStorage (hasil simpanan Admin)
        const storedPosts = JSON.parse(localStorage.getItem("maul_posts")) || [];

        // Data default jika localStorage belum terisi
        const defaultPosts = [
          {
            id: "1",
            title: "Dzikir & Do'a Pagi",
            type: "Dzikir & Do'a",
            category: "Dzikir & Do'a",
            date: "10 Oktober 2026",
            cover: "assets/cover-dzikir.jpg",
            coreMessage:
              "Kumpulan bacaan dzikir dan doa penenang hati untuk mengawali pagi hari.",
            fullContent:
              "<h2 id='istiadzah'>Isti'adzah</h2><p>أَعُوذُ بِاللَّهِ مِنَ الشَّيْطَانِ الرَّجِيمِ...</p>",
          },
        ];

        const allPosts = storedPosts.length > 0 ? storedPosts : defaultPosts;

        // 3. Cari postingan berdasarkan ID
        let post = allPosts.find((p) => String(p.id) === String(articleId));

        // Jika tidak ketemu berdasarkan ID, coba cari berdasarkan ID di default
        if (!post) {
          post = allPosts[0];
        }

        if (!post) {
          document.getElementById("articleContent").innerHTML =
            "<p>Postingan tidak ditemukan.</p>";
          return;
        }

        // 4. Render Judul Halaman
        document.title = `${post.title} — Maul Prs`;

        // 5. Render Informasi Detail Artikel
        const bd = post.bookData || {};
        const catName =
          post.type || post.category || bd.bookMainCategory || "Catatan";

        document.getElementById("articleCategoryBadge").textContent = catName;
        document.getElementById("articleTitleDisplay").textContent = post.title;
        document.getElementById("articleCoreDisplay").textContent =
          post.coreMessage || bd.bookCore || post.summary || "";
        document.getElementById("articleDateDisplay").textContent =
          post.date || "-";

        // Render Penulis jika ada (Khusus Book Summary)
        const authorEl = document.getElementById("articleMetaAuthor");
        if (bd.bookAuthor) {
          authorEl.textContent = `✍️ Penulis: ${bd.bookAuthor} ${
            bd.bookYear ? `(${bd.bookYear})` : ""
          }`;
          authorEl.style.display = "block";
        } else {
          authorEl.style.display = "none";
        }

        // Render Gambar Cover dengan Penanganan Aman
        const coverEl = document.getElementById("articleCover");
        if (post.cover && post.cover.trim() !== "") {
          coverEl.src = post.cover;
          coverEl.style.display = "block";
        } else {
          coverEl.src = "assets/default-cover.png";
        }

        // Render Isi Konten Artikel
        const rawContent =
          post.fullContent ||
          `<p>${post.coreMessage || bd.bookCore || post.title}</p>`;
        document.getElementById("articleContent").innerHTML = rawContent;

        // Generate Daftar Isi di Sidebar Kanan
        generateTableOfContents();
      });

      function generateTableOfContents() {
        const headings = document
          .getElementById("articleContent")
          .querySelectorAll("h2, h3");
        const tocCard = document.getElementById("tocSidebarCard");
        const tocList = document.getElementById("tocList");

        if (headings.length === 0) {
          tocCard.style.display = "none";
          return;
        }

        let html = "";
        headings.forEach((h, index) => {
          if (!h.id) h.id = `heading-${index}`;
          html += `<li><a href="#${h.id}">📌 ${h.textContent}</a></li>`;
        });
        tocList.innerHTML = html;
        tocCard.style.display = "block";
      }
    </script>
  </body>
</html>
