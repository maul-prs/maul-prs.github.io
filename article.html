<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detail Artikel - Maul Prs</title>
    <style>
        body { font-family: 'Poppins', sans-serif; max-width: 750px; margin: 40px auto; padding: 0 20px; color: #333; line-height: 1.8; background: #fdfdfd; }
        .back-link { display: inline-block; margin-bottom: 20px; color: #3498db; text-decoration: none; font-weight: 500; }
        .back-link:hover { text-decoration: underline; }
        h1 { color: #2c3e50; margin-bottom: 10px; }
        .date { font-size: 0.9rem; color: #888; margin-bottom: 30px; border-bottom: 1px solid #eee; padding-bottom: 10px; }
        .content { margin-top: 20px; }
        .error-box { background: #ffebee; color: #c0392b; padding: 15px; border-radius: 5px; border: 1px solid #ffcdd2; margin-top: 20px; }
    </style>
</head>
<body>

    <a href="index.html" class="back-link">&larr; Kembali ke Beranda</a>
    
    <main id="article-content">
        <p>Memuat isi artikel...</p>
    </main>

    <script>
        async function loadArticle() {
            const container = document.getElementById('article-content');
            const params = new URLSearchParams(window.location.search);
            const postId = params.get('id');

            if (!postId) {
                container.innerHTML = `<div class="error-box"><strong>Error:</strong> ID Artikel tidak ditemukan pada URL.</div>`;
                return;
            }

            try {
                // 1. Ambil data dari posts.json (pastikan file posts.json ada di luar folder data/articles)
                const res = await fetch('data/posts.json');
                if (!res.ok) throw new Error('Gagal mengambil file database posts.json');
                
                const posts = await res.json();
                const post = posts.find(p => p.id === postId);

                if (!post) {
                    container.innerHTML = `<div class="error-box"><strong>Error:</strong> Artikel dengan ID "<strong>${postId}</strong>" tidak terdaftar di database posts.json.</div>`;
                    return;
                }

                // 2. Ambil file HTML isi artikel dari folder articles/
                const articleUrl = `articles/${post.filename}`;
                const articleRes = await fetch(articleUrl);
                
                if (!articleRes.ok) {
                    throw new Error(`File HTML artikel tidak ditemukan di path: <code>${articleUrl}</code>. Pastikan folder "articles" dan file "${post.filename}" sudah ter-upload.`);
                }
                
                const htmlContent = await articleRes.text();

                // 3. Tampilkan ke halaman
                container.innerHTML = `
                    <h1>${post.title}</h1>
                    <div class="date">Dipublikasikan pada: ${post.date}</div>
                    <div class="content">${htmlContent}</div>
                `;
                document.title = `${post.title} - Maul Prs`;

            } catch (err) {
                console.error(err);
                container.innerHTML = `
                    <div class="error-box">
                        <h3>Gagal memuat isi artikel</h3>
                        <p>${err.message}</p>
                        <hr style="border:0; border-top:1px solid #ffcdd2; margin:10px 0;">
                        <small>Tips: Jika Anda menguji secara lokal di komputer, pastikan Anda menggunakan local server (seperti Live Server VS Code) agar fungsi fetch file berjalan lancar.</small>
                    </div>
                `;
            }
        }

        loadArticle();
    </script>
</body>
</html>
