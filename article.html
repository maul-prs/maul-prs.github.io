<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title id="pageTitle">Detail Artikel — Maul Prs</title>
    <link rel="stylesheet" href="css/style.css" />
    <style>
      html { scroll-behavior: smooth; }
      .site-header { padding: 10px 0 !important; }
      .site-header .nav { min-height: auto !important; }

      .article-layout {
        display: grid;
        grid-template-columns: 240px 1fr 260px;
        gap: 24px;
        padding: 20px 0 80px 0;
        align-items: start;
      }

      .sidebar-card, .category-card-container, .toc-card-container {
        background: var(--bg-card);
        border: 1px solid var(--border-color);
        border-radius: 12px;
        padding: 18px;
        margin-bottom: 20px;
      }

      .sidebar-left-sticky, .sidebar-right-sticky {
        position: sticky;
        top: 75px;
      }

      .category-scroll-area, .toc-scroll-area {
        max-height: 280px;
        overflow-y: auto;
      }

      /* Kotak Informasi Utama Artikel / Buku */
      .article-hero-box {
        background: rgba(3, 42, 24, 0.7);
        border: 1px solid var(--border-color);
        border-radius: 12px;
        padding: 24px;
        display: grid;
        grid-template-columns: 160px 1fr;
        gap: 22px;
        margin-bottom: 28px;
        align-items: center;
      }

      .article-hero-cover {
        width: 100%;
        height: 210px;
        border-radius: 8px;
        object-fit: cover;
        border: 1px solid var(--border-color);
      }

      .article-hero-info {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .article-badge-tag {
        display: inline-block;
        background: #032a18;
        border: 1px solid var(--border-color);
        color: var(--accent-light);
        font-size: 11px;
        font-weight: 600;
        padding: 3px 10px;
        border-radius: 12px;
        width: fit-content;
      }

      .article-title-sub {
        font-size: 26px;
        font-weight: 800;
        color: #ffffff;
        margin: 0;
        line-height: 1.25;
      }

      .article-core-desc {
        font-size: 14px;
        color: var(--text-main);
        line-height: 1.6;
        margin: 2px 0;
      }

      .main-article-card {
        background: var(--bg-card);
        border: 1px solid var(--border-color);
        border-radius: 12px;
        padding: 28px;
      }

      .article-content {
        color: var(--text-main);
        line-height: 1.8;
        font-size: 16px;
      }

      .article-content h2, .article-content h3 {
        color: #fff;
        margin-top: 32px;
        scroll-margin-top: 80px;
      }

      @media (max-width: 1024px) {
        .article-layout { grid-template-columns: 1fr; }
        .article-hero-box { grid-template-columns: 100px 1fr; gap: 14px; padding: 14px; }
        .article-hero-cover { height: 130px; }
        .article-title-sub { font-size: 17px; }
      }
    </style>
  </head>
  <body>
    <header class="site-header">
      <div class="container nav">
        <a class="brand" href="index.html">
          <img class="brand-photo" src="assets/profile.png" alt="Maul Prs" onerror="this.style.display='none'" />
          <span>Maul Prs</span>
        </a>
        <a href="index.html" style="color: var(--accent-light); text-decoration: none; font-size: 13px; font-weight: 500;">
          ← Beranda
        </a>
      </div>
    </header>

    <main class="container article-layout">
      <!-- SIDEBAR KIRI: Kategori -->
      <div class="sidebar-left-sticky">
        <aside class="category-card-container">
          <h3 class="sidebar-title">Kategori & Menu</h3>
          <div class="category-scroll-area">
            <ul class="category-list" id="categorySidebar"></ul>
          </div>
        </aside>
      </div>

      <!-- KONTEN UTAMA ARTIKEL -->
      <section class="main-article-card">
        <!-- Hero Box Informasi Artikel (Cover + Inti/Ringkasan) -->
        <div id="articleHeroBox" class="article-hero-box">
          <img id="articleCover" src="" alt="Cover" class="article-hero-cover" />
          <div class="article-hero-info">
            <span id="articleCategoryBadge" class="article-badge-tag">Kategori</span>
            <h1 id="articleTitleDisplay" class="article-title-sub">-</h1>
            <p id="articleMetaAuthor" style="color: var(--text-muted); font-size: 13px; margin: 0; display: none;"></p>
            <p id="articleCoreDisplay" class="article-core-desc">-</p>
            <div style="font-size: 12px; color: var(--text-muted); border-top: 1px solid rgba(255,255,255,0.08); padding-top: 8px;">
              📅 Tanggal: <strong id="articleDateDisplay" style="color: #fff;">-</strong>
            </div>
          </div>
        </div>

        <article id="articleContent" class="article-content">
          <p style="color: var(--text-muted);">Memuat konten...</p>
        </article>
      </section>

      <!-- SIDEBAR KANAN: Daftar Bab (TOC) -->
      <div class="sidebar-right-sticky">
        <aside id="tocSidebarCard" class="toc-card-container" style="display: none;">
          <h3 class="sidebar-title">📖 Bab & Sub-Judul</h3>
          <div class="toc-scroll-area">
            <ul class="toc-list" id="tocList"></ul>
          </div>
        </aside>
      </div>
    </main>

    <script>
      // Struktur Data Statis untuk GitHub (Ganti dengan fetch('posts.json') jika menggunakan file JSON terpisah)
      const staticPostsDatabase = [
        {
          id: "1",
          title: "Dzikir & Do'a Pagi",
          category: "Dzikir & Do'a",
          date: "10 Oktober 2026",
          cover: "assets/cover-dzikir.jpg",
          coreMessage: "Kumpulan bacaan dzikir dan doa penenang hati untuk mengawali pagi hari.",
          fullContent: "<h2 id='istiadzah'>Isti'adzah</h2><p>أَعُوذُ بِاللَّهِ مِنَ الشَّيْطَانِ الرَّجِيمِ...</p>"
        }
        // Tambahkan data postingan lainnya di sini sesuai kebutuhan GitHub Anda
      ];

      window.addEventListener("DOMContentLoaded", () => {
        const urlParams = new URLSearchParams(window.location.search);
        const articleId = urlParams.get("id") || staticPostsDatabase[0].id;

        const post = staticPostsDatabase.find(p => String(p.id) === String(articleId)) || staticPostsDatabase[0];

        document.title = `${post.title} — Maul Prs`;
        
        // Render Badge Kategori sesuai data asli (Bukan default Book Summary)
        document.getElementById("articleCategoryBadge").textContent = post.category;
        document.getElementById("articleTitleDisplay").textContent = post.title;
        document.getElementById("articleCoreDisplay").textContent = post.coreMessage || post.summary || "";
        document.getElementById("articleDateDisplay").textContent = post.date;

        const coverEl = document.getElementById("articleCover");
        if (post.cover) {
          coverEl.src = post.cover;
          coverEl.style.display = "block";
        } else {
          coverEl.style.display = "none";
        }

        document.getElementById("articleContent").innerHTML = post.fullContent || "<p>Belum ada isi konten.</p>";
        generateTableOfContents();
      });

      function generateTableOfContents() {
        const headings = document.getElementById("articleContent").querySelectorAll("h2, h3");
        const tocCard = document.getElementById("tocSidebarCard");
        const tocList = document.getElementById("tocList");

        if (headings.length === 0) {
          tocCard.style.display = "none";
          return;
        }

        let html = "";
        headings.forEach((h, index) => {
          if (!h.id) h.id = `heading-${index}`;
          html += `<li><a href="#${h.id}">📌 ${h.textContent}</a></li>`;
        });
        tocList.innerHTML = html;
        tocCard.style.display = "block";
      }
    </script>
  </body>
</html>
