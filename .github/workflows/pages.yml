name: Build & Deploy Website

on:
  push:
    branches: [main, master]
  workflow_dispatch:
  schedule:
    # GitHub memakai UTC: 17:05 UTC = 00:05 WIB. Membangun ulang tiap hari supaya artikel terjadwal tayang saat tanggalnya tiba.
    - cron: '5 17 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Upaya otomatis mengatur Settings → Pages → Source = "GitHub Actions".
      # Kalau gagal (izin token tidak cukup) langkah ini diabaikan; atur manual sekali saja.
      - name: Pastikan Pages memakai GitHub Actions
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PUT "repos/${{ github.repository }}/pages" -f build_type=workflow \
            || gh api -X POST "repos/${{ github.repository }}/pages" -f build_type=workflow

      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build static site
        run: node build.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
